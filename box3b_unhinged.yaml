esphome:
  name: unhinged-box3b
  friendly_name: Unhinged Agent

esp32:
  board: esp32s3box
  framework:
    type: esp-idf

# Enable logging and native API
logger:
api:
  encryption:
    key: "" # Leave empty for local dev, or generate a noise_psk

ota:
  - platform: esphome

wifi:
  ssid: "YOUR_WIFI_SSID"
  password: "YOUR_WIFI_PASSWORD"

# Hardware definitions for the ESP32-S3-BOX-3
i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO45
    i2s_bclk_pin: GPIO17

microphone:
  - platform: i2s_audio
    id: box_mic
    adc_type: external
    i2s_din_pin: GPIO16
    i2s_audio_id: i2s_audio_bus
    pdm: true

speaker:
  - platform: i2s_audio
    id: box_speaker
    dac_type: external
    i2s_dout_pin: GPIO15
    i2s_audio_id: i2s_audio_bus
    mode: mono

# The Voice Assistant Component (The Magic)
voice_assistant:
  id: va
  microphone: box_mic
  speaker: box_speaker
  use_wake_word: true
  vad_threshold: 3 # Aggressive VAD to catch speech quickly
  
  # Local wake word model (built into ESPHome for S3)
  wake_word:
    - model: hey-jarvis

  # When the API client (our Python script) is ready, it will handle the rest
  on_client_connected:
    - logger.log: "Python Bridge Connected"
  on_client_disconnected:
    - logger.log: "Python Bridge Disconnected"