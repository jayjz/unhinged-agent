esphome:
  name: unhinged-box3b
  friendly_name: Unhinged Agent
  platformio_options:
    board_build.flash_mode: qio
    board_build.psram_type: opi

esp32:
  board: esp32s3box
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_SPIRAM: "y"
      CONFIG_SPIRAM_MODE_OCT: "y"
      CONFIG_SPIRAM_SPEED_80M: "y"

logger:
api:
  encryption:
    key: "" 

ota:
  - platform: esphome

wifi:
  ssid: "YOUR_WIFI_SSID"
  password: "YOUR_WIFI_PASSWORD"

# ==========================================
# 🔊 AUDIO HARDWARE & DSP ROUTING
# ==========================================
i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO45
    i2s_bclk_pin: GPIO17

microphone:
  - platform: i2s_audio
    id: box_mic
    adc_type: external
    i2s_din_pin: GPIO16
    i2s_audio_id: i2s_audio_bus
    pdm: true

speaker:
  - platform: i2s_audio
    id: box_speaker_dac
    dac_type: external
    i2s_dout_pin: GPIO15
    i2s_audio_id: i2s_audio_bus
    mode: mono

media_player:
  - platform: speaker
    id: box_media_player
    speaker: box_speaker_dac

# ==========================================
# 📺 DISPLAY HARDWARE & SPI BUS
# ==========================================
spi:
  clk_pin: GPIO7
  mosi_pin: GPIO6
  miso_pin: GPIO0 

display:
  - platform: ili9341
    model: M5Stack 
    id: box_display
    cs_pin: GPIO5
    dc_pin: GPIO4
    reset_pin: GPIO48

# ==========================================
# 🎨 LVGL UI SCAFFOLDING
# ==========================================
lvgl:
  displays:
    - display: box_display
  
  widgets:
    - label:
        id: fsm_state_label
        text: "IDLE"
        align: CENTER
        text_align: CENTER

# ==========================================
# 🧠 ESP-SR VOICE ASSISTANT & FSM MAPPING
# ==========================================
voice_assistant:
  id: va
  microphone: box_mic
  media_player: box_media_player 
  use_wake_word: true
  vad_threshold: 3 
  noise_suppression_level: 2 
  
  wake_word:
    - model: hey-jarvis

  on_client_connected:
    - logger.log: "Python Bridge Connected: Ready for FSM Sync"
    - lvgl.label.update:
        id: fsm_state_label
        text: "CONNECTED\nREADY"
  
  on_client_disconnected:
    - logger.log: "Python Bridge Disconnected"
    - lvgl.label.update:
        id: fsm_state_label
        text: "OFFLINE"

  on_listening:
    - logger.log: "[EDGE] State: LISTENING"
    - lvgl.label.update:
        id: fsm_state_label
        text: "LISTENING..."
        
  on_stt_end:
    - logger.log: "[EDGE] State: THINKING (VAD detected silence)"
    - lvgl.label.update:
        id: fsm_state_label
        text: "THINKING..."
        
  on_tts_start:
    - logger.log: "[EDGE] State: SPEAKING"
    - lvgl.label.update:
        id: fsm_state_label
        text: "SPEAKING"
        
  on_tts_end:
    - logger.log: "[EDGE] State: IDLE"
    - lvgl.label.update:
        id: fsm_state_label
        text: "IDLE"